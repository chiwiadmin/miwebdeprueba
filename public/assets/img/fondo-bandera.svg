    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="softSun" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd35c"/><stop offset="1" stop-color="#f0a81a"/>
    </radialGradient>
  </defs>

